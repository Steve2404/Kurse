# C'est le filet de securite final : Java retombe ICI des qu'aucune
# version plus precise (messages_xx.properties, messages_xx_YY.properties)
# n'existe pour la Locale demandee, ou que la cle n'y est pas trouvee.
# C'est pour ca que ce fichier, seul, contient TOUTES les cles.
